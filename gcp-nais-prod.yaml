apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: pgi-les-hendelse-skatt
  namespace: pensjonopptjening
  labels:
    team: pensjonopptjening
spec:
  image: {{ image }}
  port: 8080
  kafka:
    pool: nav-prod
  maskinporten:
    enabled: true
    scopes:
      consumes:
        - name: "skatteetaten:pensjonsgivendeinntektforfolketrygden"
  liveness:
    path: /actuator/health/liveness
    port: 8080
    initialDelay: 50
  readiness:
    path: /actuator/health/readiness
    port: 8080
    initialDelay: 50
  prometheus:
    enabled: true
    path: /actuator/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
  replicas:
    min: 1
    max: 1
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod-gcp
    - name: APP_TEAM
      value: pensjonopptjening
    - name: GRUNNLAG_PGI_HENDELSE_HOST
      value: https://pgiforfolketrygdenhendelser.api.skatteetaten.no
    - name: GRUNNLAG_PGI_FIRST_SEKVENSNUMMER_HOST
      value: https://pgiforfolketrygdenhendelser.api.skatteetaten.no
    - name: SKATT_HENDELSE_PATH
      value: /v1/hendelser
    - name: SKATT_HENDELSE_START_PATH
      value: /v1/hendelser/start
    - name: DELAY_IN_SECONDS_BEFORE_POLLING_SKATT
      value: "30"
#    - name: TILBAKESTILL_SEKVENSNUMMER
#      value: "true"
#    - name: TILBAKESTILL_SEKVENSNUMMER_TIL
#      value: "2025-11-01"
    - name: JAVA_TRUSTSTORE_OPTIONS
      value: "-Djavax.net.ssl.trustStore=$(NAV_TRUSTSTORE_PATH)
              -Djavax.net.ssl.trustStorePassword=$(NAV_TRUSTSTORE_PASSWORD)"
    - name: JDK_JAVA_OPTIONS
      value: "-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/ -Xmx256m -Djdk.tls.client.protocols=TLSv1.2 $(JAVA_TRUSTSTORE_OPTIONS)"
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
      external:
        - host: pgiforfolketrygdenhendelser.api.skatteetaten.no
